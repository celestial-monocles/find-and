<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Combined Tool: Find & Replace + Text Splitter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      margin: 0;
      padding: 20px;
      background-color: #2a2a2a;
      color: #B5AEE8;
    }

    h1, h2 {
      text-align: center;
    }

    a {
      color: #B5AEE8;
      text-decoration: none;
    }
    
    input, textarea, select {
      font-size: 16px;
      touch-action: manipulation;
    }

    button {
      background-color: #B287CC;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #A84B8C;
    }
    
    #clearBtn {
      display: block;
      background-color: #A84A46;
      margin: 10px auto;
    }
    
    #toggleFindReplaceBtn {
       background-color: #1f1f1f;
    }
    
    button[onclick="replaceText()"] {
      display: block;
      margin: 10px auto;
    }
    
    #exportImportButtons {
      text-align: center;
      margin-bottom: 15px;
    }

    #exportImportButtons button {
      margin: 0 10px;
    }
    
    #addClearContainer {
      text-align: center;
      margin-top: 15px;
    }

    #addClearContainer button {
      margin: 0 10px;
    }
    
    #clearFindBtn {
      background-color: #A84A46;
    }
    
    #matchWordsContainer {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px;
    }

    .checkbox-group {
      text-align: center;
    }

    .checkbox-group div {
      margin-bottom: 5px;
      color: #B5AEE8;
    }

    #matchWordsContainer input[type="checkbox"] {
      width: auto;
      margin: 0 auto;
      transform: scale(1.3);
    }
    
    #replacementSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      text-align: center;
    }
    
    #toggleReplacementsBtn {
      background-color: #1f1f1f;
    }
    
    /* Updated styles for pair wrappers with hover insert buttons */
    .pair-wrapper {
      position: relative;
      margin-bottom: 2px;
    }

    /* Insert button - hidden by default */
    .pair-insert-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      background-color: #9f6eb0;
      color: white;
      border-radius: 50%;
      border: 2px solid #d4b3e6;
      font-size: 20px;
      font-weight: bold;
      display: none;  /* Hidden by default */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
      line-height: 1;
      z-index: 10;
      top: -14px;  /* Positioned between rows */
    }

    /* Show button when hovering over the wrapper */
    .pair-wrapper:hover .pair-insert-btn {
      display: flex;
    }

    .pair-insert-btn:hover {
      background-color: #b87fd0;
      transform: translateX(-50%) scale(1.1);
      box-shadow: 0 3px 10px rgba(0,0,0,0.8);
    }

    .pair-insert-btn:active {
      background-color: #8a5ca0;
      transform: translateX(-50%) scale(0.95);
    }

    /* First wrapper's button positioned at top */
    .pair-wrapper:first-child .pair-insert-btn {
      top: -14px;
    }

    .find-replace-pair {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin: 8px 0 4px 0;  /* Increased margin to make room for button */
      border-radius: 8px;
      background-color: #5E5E5E;
      position: relative;
      z-index: 1;
    }

    /* Extra top margin for first row to prevent button from being cut off */
    .pair-wrapper:first-child .find-replace-pair {
      margin-top: 12px;
    }

    .pair-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .remove-button {
      color: #e74c3c;
      cursor: pointer;
      font-weight: bold;
      margin-left: auto;
      font-size: 20px;
      transition: color 0.2s;
    }

    .remove-button:hover {
      color: #ff0000;
    }
    
    #toggleFindReplaceBtnBottom {
      background-color: #1f1f1f;
      margin: 0 auto;
      display: none;
    }

    
    #splitButtonsContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    #splitButtonsContainer button {
      display: inline-block;
      margin: 0;
      padding: 10px 20px;
      min-width: 120px;
      cursor: pointer;
      font-weight: bold;
    }

    #charCount {
        text-align: center;
    }
    
    #NumSplit {
        text-align: center;
    }
    
    #lineText {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }
    
    button[onclick="splitText()"] {
      display: block;
      margin: 20px auto;
    }
    
    #splitNumber {
      width: 80px;
      max-width: 100%;
      text-align: center;
    }

    #numSplitContainer {
      text-align: center;
      margin: 15px 0;
    }

    #numSplitContainer input {
      width: 80px;
      margin-top: 5px;
    }
    
    #lineGapContainer {
      text-align: center;
      margin-top: 10px;
    }

    #lineGapContainer div {
      margin-bottom: 5px;
      color: #B5AEE8;
    }

    #lineGap {
      width: auto;
      margin: 0 auto;
    }

    .section {
      max-width: 800px;
      margin: 0 auto 60px;
      padding: 20px;
      background-color: #1f1f1f;
      border-radius: 10px;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      border: none;
      resize: vertical;
      font-family: monospace;
    }

    .drag-handle {
      cursor: move;
      font-size: 18px;
      color: #B287CC;
      user-select: none;
      margin-right: 5px;
    }
    
    .drag-handle:hover {
      color: #d4b3e6;
    }
    
    #resultText {
      background-color: #E8D9FF;
      color: #000;
    }

    /* Text Splitter Specific Styles */
    .output-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .output-box {
      width: 100%;
      background-color: #B8C3E0;
      color: #000;
      resize: vertical;
      margin-bottom: 10px;
    }

    .copy-button {
      font-weight: bold;
      cursor: pointer;
    }
    
    /* Text Splitter Section */
    #textSplitterApp {
      color: #90BFE0;
    }

    #textSplitterApp button {
      color: white;
    }

    #textSplitterApp label,
    #textSplitterApp #charCount,
    #textSplitterApp .output-container div,
    #textSplitterApp #numSplitContainer label,
    #textSplitterApp #lineGapContainer div {
      color: #90BFE0;
    }

    #textSplitterApp textarea::placeholder {
      color: #90BFE0;
      opacity: 0.7;
    }
    
    /* Text Splitter buttons */
    #textSplitterApp #splitTextButton,
    #textSplitterApp .copy-button,
    #textSplitterApp .paste-button {
      color: #46D1E0;
      background-color: #1f1f1f;
      border: 1px solid #46D1E0;
    }

    #textSplitterApp #clearSplitButton {
      color: white;
      background-color: #A84A46;
      border: none;
    }

    #textSplitterApp #splitTextButton:hover,
    #textSplitterApp .copy-button:hover,
    #textSplitterApp .paste-button:hover {
      background-color: #46D1E0;
      color: #1f1f1f;
    }
    
    /* Paste button styles */
    .textarea-container {
      position: relative;
    }
    
    .paste-button {
      position: absolute;
      right: 10px;
      top: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      z-index: 10;
    }

    /* Find & Replace paste button */
    #findReplaceApp .paste-button {
      background-color: #B287CC;
      color: white;
    }

    #findReplaceApp .paste-button:hover {
      background-color: #A84B8C;
    }

    /* Navigation buttons */
    #navButtons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    #navButtons button {
      background-color: #444;
      color: white;
      border: none;
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      opacity: 0.9;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
      box-shadow: 0 0 0 rgba(183, 174, 232, 0);
    }

    #navButtons button:hover {
      opacity: 1;
      box-shadow: 0 0 10px 3px rgba(183, 174, 232, 0.7);
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      #exportImportButtons button,
      #addClearContainer button {
        display: block;
        width: 100%;
        margin: 5px 0;
      }
      
      .paste-button {
        padding: 8px 12px;
        font-size: 16px;
      }
      
      .pair-insert-btn {
        width: 32px;
        height: 32px;
        font-size: 22px;
        top: -16px;
      }
    }
  </style>
</head>
<body>
  <div id="navButtons">
    <button onclick="scrollToSection('findReplaceApp')">↑</button>
    <button onclick="scrollToSection('textSplitterApp')">↓</button>
  </div>

  <!-- FIND AND REPLACE SECTION -->
  <div class="section" id="findReplaceApp">
    <h1><a href="https://celestial-monocles.github.io/findandreplace/">Find and Replace Text</a></h1>
    <div class="textarea-container">
      <textarea id="inputText" rows="10" placeholder="Enter your text here..."></textarea>
      <button class="paste-button" onclick="handlePaste('inputText')">Paste</button>
    </div>
    <button id="clearBtn" onclick="clearInputText()">Clear Input</button>

    <h2><button onclick="toggleFindReplaceSection()" id="toggleFindReplaceBtn">▼ Find and Replace List</button></h2>
    <div id="findReplaceSection">
      <div id="exportImportButtons">
        <button onclick="exportList()">Export List</button>
        <button onclick="importList()">Import List</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
      
      <!-- Container for find/replace pairs with hover buttons -->
      <div id="findReplaceContainer"></div>
      
      <!-- Bottom insert button (always visible) -->
      <div style="display: flex; justify-content: center; margin: 10px 0;">
        <span class="pair-insert-btn" style="position: relative; display: flex; transform: none; left: auto; top: auto;" onclick="addFindReplacePair()" title="Add new row at bottom">+</span>
      </div>
      
      <div id="addClearContainer">
        <button id="clearFindBtn" onclick="clearFindReplaceInputs()">Clear All</button>
      </div>
      <div id="matchWordsContainer">
        <div class="checkbox-group">
          <div>Match Case</div>
          <input type="checkbox" id="matchCase">
        </div>
        <div class="checkbox-group">
          <div>Whole Words</div>
          <input type="checkbox" id="wholeWords">
        </div>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 15px;">
      <button onclick="toggleFindReplaceSection()" id="toggleFindReplaceBtnBottom">▲ Collapse</button>
    </div>

    <button onclick="replaceText()">Replace</button><br><br>

    <h2>Result:</h2>
    <textarea id="resultText" rows="10" readonly></textarea>
    <div id="copyButtonContainer" style="text-align:center;">
      <button id="copyButton" onclick="copyResultText()" style="display:none;">Copy Result</button>
    </div>
    <div id="replacementSection">
      <button id="toggleReplacementsBtn" onclick="toggleReplacements()" style="display:none;">- Replacements</button>
      <div id="replacementDetails"></div>
    </div>
  </div>

  <!-- TEXT SPLITTER SECTION -->
  <div class="section" id="textSplitterApp">
    <h1>Text Splitter</h1>
    <div class="textarea-container">
      <textarea id="splitInput" rows="10" placeholder="Paste your text here..." oninput="updateCharCount()"></textarea>
      <button class="paste-button" onclick="handlePaste('splitInput')">Paste</button>
    </div>
    <div id="charCount">Character Count: 0</div>

    <div id="numSplitContainer">
      <label for="splitNumber">Number of Splits:</label><br>
      <input id="splitNumber" type="number" min="1" placeholder="2" />
    </div>

    <div id="lineGapContainer" style="text-align: center; margin-top: 10px;">
      <div>Line Gaps</div>
      <input id="lineGap" type="checkbox">
    </div>

    <div id="splitButtonsContainer">
      <button id="splitTextButton" onclick="splitText()">Split Text</button>
      <button id="clearSplitButton" onclick="clearSplitInput()" style="display: none;">Clear Input</button>
    </div>

    <h2>Split Text Outputs</h2>
    <div id="outputContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script>
    // -------- UTILITY FUNCTIONS --------
    function scrollToSection(id) {
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
    }

    // Improved paste handler
    async function handlePaste(textareaId) {
      const textarea = document.getElementById(textareaId);
      textarea.focus();
      
      try {
        // Try modern Clipboard API first
        if (navigator.clipboard && navigator.clipboard.readText) {
		  try {
			const text = await navigator.clipboard.readText();
			textarea.value = text;
			updateUIAfterPaste(textareaId);
			return;
		  } catch (err) {
			console.error("Clipboard access denied:", err);
		  }
		}
        
        // Fallback to execCommand for older browsers
        if (document.execCommand('paste')) {
          updateUIAfterPaste(textareaId);
          return;
        }
        
        // Final fallback
        textarea.placeholder = "Please paste manually (Ctrl+V)";
        alert("Please use keyboard paste (Ctrl+V/Cmd+V) or check browser permissions.");
      } catch (err) {
        console.error("Paste failed:", err);
        textarea.placeholder = "Paste failed - try manual paste";
      }
    }

    function updateUIAfterPaste(textareaId) {
      if (textareaId === 'splitInput') {
        updateCharCount();
        document.getElementById('clearSplitButton').style.display = "inline-block";
      }
      if (textareaId === 'inputText') {
        toggleCopyButtonVisibility();
      }
    }

    // -------- FIND AND REPLACE FUNCTIONS --------
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Create a single find/replace pair element (without wrapper)
    function createPairElement(findValue = '', replaceValue = '') {
      const pairDiv = document.createElement('div');
      pairDiv.className = 'find-replace-pair';
      
      // Escape quotes for HTML attributes
      const escapedFind = findValue.replace(/"/g, '&quot;');
      const escapedReplace = replaceValue.replace(/"/g, '&quot;');
      
      pairDiv.innerHTML = `
        <div class="pair-content">
          <span class="drag-handle" title="Drag to reorder">☰</span>
          <label>Find:</label><input class="find" type="text" value="${escapedFind}">
          <label>Replace:</label><input class="replace" type="text" value="${escapedReplace}">
        </div>
        <span class="remove-button" onclick="removePair(this)" title="Remove this row">✖</span>
      `;
      return pairDiv;
    }

    // Create a wrapper with hover insert button
    function createWrapperWithButton(find = '', replace = '') {
      const wrapper = document.createElement('div');
      wrapper.className = 'pair-wrapper';
      
      // Create insert button (hidden by default via CSS)
      const insertBtn = document.createElement('span');
      insertBtn.className = 'pair-insert-btn';
      insertBtn.textContent = '+';
      insertBtn.setAttribute('title', 'Insert new row above');
      
      // Add click handler to insert a new row above this wrapper
      insertBtn.onclick = function(e) {
        e.stopPropagation();
        const currentWrapper = this.closest('.pair-wrapper');
        const container = document.getElementById('findReplaceContainer');
        const newWrapper = createWrapperWithButton('', '');
        container.insertBefore(newWrapper, currentWrapper);
        reinitSortable();
      };
      
      // Create the pair element
      const pair = createPairElement(find, replace);
      
      // Assemble wrapper: button first, then pair
      wrapper.appendChild(insertBtn);
      wrapper.appendChild(pair);
      
      return wrapper;
    }

    // Initialize or reset the container
    function renderPairsFromArray(pairsArray) {
      const container = document.getElementById('findReplaceContainer');
      container.innerHTML = '';
      
      if (pairsArray.length === 0) {
        // Always show at least one empty pair
        container.appendChild(createWrapperWithButton('', ''));
      } else {
        pairsArray.forEach(p => {
          container.appendChild(createWrapperWithButton(p.find || '', p.replace || ''));
        });
      }
      
      reinitSortable();
    }

    // Get current pairs as array of objects
    function getCurrentPairs() {
      const wrappers = document.querySelectorAll('#findReplaceContainer .pair-wrapper');
      const pairs = [];
      
      wrappers.forEach(wrapper => {
        const findInput = wrapper.querySelector('.find');
        const replaceInput = wrapper.querySelector('.replace');
        if (findInput && replaceInput) {
          pairs.push({
            find: findInput.value,
            replace: replaceInput.value
          });
        }
      });
      
      return pairs;
    }

    // Add new pair at the bottom
    function addFindReplacePair(find = '', replace = '') {
      const container = document.getElementById('findReplaceContainer');
      const newWrapper = createWrapperWithButton(find, replace);
      container.appendChild(newWrapper);
      reinitSortable();
    }

    // Remove a pair (called from remove button)
    function removePair(removeSpan) {
      const wrapper = removeSpan.closest('.pair-wrapper');
      const container = document.getElementById('findReplaceContainer');
      
      if (container.children.length <= 1) {
        alert("At least one pair must remain.");
        return;
      }
      
      wrapper.remove();
      reinitSortable();
    }

    function clearInputText() {
      document.getElementById("inputText").value = '';
      toggleCopyButtonVisibility();
    }

    function clearFindReplaceInputs() {
      renderPairsFromArray([]); // This will create one empty pair automatically
    }

    function replaceText() {
      let text = document.getElementById("inputText").value;
      text = text.replace(/[\u2028\u2029\u0085\u000B\u000C]/g, '\n').replace(/\r\n|\r/g, '\n');

      const pairs = getCurrentPairs();
      const matchCase = document.getElementById("matchCase").checked;
      const wholeWords = document.getElementById("wholeWords").checked;
      const flags = matchCase ? 'g' : 'gi';

      const counts = [];

      pairs.forEach(({ find, replace }) => {
        if (find && find.trim() !== '') {
          let pattern = wholeWords ? `\\b${escapeRegExp(find)}\\b` : escapeRegExp(find);
          try {
            const regex = new RegExp(pattern, flags);
            const matchCount = (text.match(regex) || []).length;
            text = text.replace(regex, replace);
            if (matchCount > 0) {
              counts.push(`Replaced "${find}" with "${replace}" ${matchCount} time(s)`);
            }
          } catch (e) {
            console.error(`Invalid pattern "${pattern}"`, e);
          }
        }
      });

      const resultText = document.getElementById("resultText");
      resultText.value = text;
      toggleCopyButtonVisibility();

      const replacementDetails = document.getElementById("replacementDetails");
      const toggleBtn = document.getElementById("toggleReplacementsBtn");

      if (counts.length > 0) {
        replacementDetails.innerHTML = `➤ ` + counts.join('<br>➤ ');
        toggleBtn.style.display = 'inline-block';
        replacementDetails.style.display = 'none';
        toggleBtn.textContent = "- Replacements";
      } else {
        replacementDetails.innerHTML = '';
        toggleBtn.style.display = 'none';
      }
    }

    function toggleCopyButtonVisibility() {
      const resultText = document.getElementById("resultText");
      const copyButton = document.getElementById("copyButton");
      copyButton.style.display = resultText.value.trim() ? 'inline-block' : 'none';
    }

    function copyResultText() {
      const resultText = document.getElementById("resultText");
      const copyButton = document.getElementById("copyButton");

      navigator.clipboard.writeText(resultText.value)
        .then(() => {
          copyButton.textContent = "Copied!";
          copyButton.disabled = true;
          setTimeout(() => {
            copyButton.textContent = "Copy Result";
            copyButton.disabled = false;
          }, 2000);
        })
        .catch(() => {
          alert("Failed to copy. Please copy manually.");
        });
    }

    function exportList() {
      const pairs = getCurrentPairs();
      const blob = new Blob([JSON.stringify(pairs, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'find_replace_list.json';
      a.click();
    }

    function importList() {
      const input = document.getElementById('importFile');
      input.value = '';
      input.click();
    }

    function handleImport(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const list = JSON.parse(e.target.result);
          if (!Array.isArray(list)) throw new Error("Invalid format");
          renderPairsFromArray(list);
        } catch (err) {
          alert("Failed to import list. Ensure it's valid JSON.");
        }
      };
      reader.readAsText(file);
    }

    function toggleReplacements() {
      const details = document.getElementById("replacementDetails");
      const toggleBtn = document.getElementById("toggleReplacementsBtn");

      if (details.style.display === "none") {
        details.style.display = "block";
        toggleBtn.textContent = "+ Replacements";
      } else {
        details.style.display = "none";
        toggleBtn.textContent = "- Replacements";
      }
    }

    function toggleFindReplaceSection() {
      const section = document.getElementById("findReplaceSection");
      const btnTop = document.getElementById("toggleFindReplaceBtn");
      const btnBottom = document.getElementById("toggleFindReplaceBtnBottom");

      const isHidden = section.style.display === "none";

      if (isHidden) {
        section.style.display = "block";
        btnTop.textContent = "▼ Find and Replace List";
        btnBottom.style.display = "inline-block";
      } else {
        section.style.display = "none";
        btnTop.textContent = "▲ Find and Replace List";
        btnBottom.style.display = "none";
      }
    }

    // Sortable instance for drag-drop
    let sortableInstance = null;

    function reinitSortable() {
      if (sortableInstance) {
        sortableInstance.destroy();
      }
      
      const container = document.getElementById('findReplaceContainer');
      sortableInstance = new Sortable(container, {
        animation: 150,
        handle: '.drag-handle',
        ghostClass: 'dragging',
        dragClass: 'dragging',
        onEnd: function() {
          // Optional: any reorder logic
        }
      });
    }

    // -------- TEXT SPLITTER FUNCTIONS --------
    function updateCharCount() {
      const text = document.getElementById("splitInput").value;
      document.getElementById("charCount").textContent = `Character Count: ${text.length}`;
      document.getElementById("clearSplitButton").style.display = text.length > 0 ? "inline-block" : "none";
    }

    function clearSplitInput() {
      document.getElementById("splitInput").value = "";
      updateCharCount();
      document.getElementById("outputContainer").innerHTML = "";
    }

    function splitText() {
      const text = document.getElementById("splitInput").value.trim().replace(/\r\n|\r|\n/g, "\n");
      let numSplits = parseInt(document.getElementById("splitNumber").value);
      const lineGap = document.getElementById("lineGap").checked;
      if (!numSplits || numSplits < 1) numSplits = 2;

      const lines = text.split("\n");
      const chunkSize = Math.ceil(lines.length / numSplits);
      const outputContainer = document.getElementById("outputContainer");
      outputContainer.innerHTML = "";

      let start = 0;
      for (let i = 0; i < numSplits; i++) {
        const chunk = lines.slice(start, start + chunkSize).join(lineGap ? "\n\n" : "\n");
        start += chunkSize;

        const container = document.createElement("div");
        container.className = "output-container";

        const textBox = document.createElement("textarea");
        textBox.className = "output-box";
        textBox.rows = 10;
        textBox.readOnly = true;
        textBox.value = chunk;

        const countDiv = document.createElement("div");
        countDiv.textContent = `Character Count: ${chunk.length}`;

        const button = document.createElement("button");
        button.className = "copy-button";
        button.textContent = "Copy Text";
        button.onclick = () => {
          navigator.clipboard.writeText(chunk).then(() => {
            button.textContent = "Copied!";
            setTimeout(() => { button.textContent = "Copy Text"; }, 2000);
          });
        };

        container.appendChild(textBox);
        container.appendChild(countDiv);
        container.appendChild(button);
        outputContainer.appendChild(container);
      }
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderPairsFromArray([{ find: '', replace: '' }]);
      toggleCopyButtonVisibility();

      const section = document.getElementById("findReplaceSection");
      const btnTop = document.getElementById("toggleFindReplaceBtn");
      const btnBottom = document.getElementById("toggleFindReplaceBtnBottom");

      if (window.innerWidth <= 768) {
        section.style.display = "none";
        btnTop.textContent = "▲ Find and Replace List";
        btnBottom.style.display = "none";
      } else {
        section.style.display = "block";
        btnTop.textContent = "▼ Find and Replace List";
        btnBottom.style.display = "inline-block";
      }
    });
  </script>
</body>
</html>
